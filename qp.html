  <audio id="audio-player"></audio>

  <script>
    const tracksData = [
      {
        title: "ᴾᵐPanagiotis🇬🇷",
        artist: "Online Radio",
        audioSrc: "https://stream.rcast.net/200586"
      }
    ];

    let currentTrackIndex = 0;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const eqVisualizer = document.getElementById('eq-visualizer');

    const songTitle = document.getElementById('song-title');
    const artistName = document.getElementById('artist-name');
// 3. Η ΔΙΚΗ ΣΑΣ ΛΙΣΤΑ ΤΡΑΓΟΥΔΙΩΝ (ON-DEMAND PLAYLIST)
  // Μπορείτε να βάλετε είτε αρχεία ήχου .mp3 είτε αρχεία βίντεο .mp4!
  const onDemandTracks = [
    {
      title: "Όνομα Τραγουδιού 1",
      artist: "Καλλιτέχνης 1",
      fileUrl: "https://ia600607.us.archive.org/9/items/latin-2025/Latin2025.mp3",
      coverUrl: "https://xatimg.com/image/rbA6aOxjB0au.png", // <- ΦΩΤΟΓΡΑΦΙΑ ΚΑΛΛΙΤΕΧΝΗ 1
      isTextOnly: true
    },
    {
      title: "Όνομα Τραγουδιού 2",
      artist: "Καλλιτέχνης 2",
      fileUrl: "https://ia800706.us.archive.org/19/items/classic-rock_202607/Classic%20Rock.mp3",
      coverUrl: "https://xatimg.com/image/9kFArAT470H7.jpg", // <- ΦΩΤΟΓΡΑΦΙΑ ΚΑΛΛΙΤΕΧΝΗ 2
      isTextOnly: true
    },
    {
      title: "Βίντεο Κλιπ Δοκιμή",
      artist: "Καλλιτέχνης Βίντεο",
      fileUrl: "https://choises.github.io/vy/GT.mp4",
      coverUrl: "", // Το βίντεο δεν χρειάζεται φωτογραφία
      isTextOnly: false
    }
  ];
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      document.getElementById('clock-time').innerText = `${hours}:${minutes}:${seconds}`;
      document.getElementById('clock-date').innerText = `${day}/${month}/${year}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracksData[currentTrackIndex];

      songTitle.innerText = track.title;
      artistName.innerText = track.artist;
      audio.src = track.audioSrc;
    }

    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      if (audio.duration) {
        progress.value = (currentTime / audio.duration) * 100 || 0;
        durationEl.innerText = formatTime(audio.duration);
      } else {
        progress.value = 100;
        durationEl.innerText = "LIVE";
      }
      currentTimeEl.innerText = formatTime(currentTime);
    });

                // ΖΩΝΤΑΝΗ ΡΟΗ: Με έξυπνη επιστροφή στο αρχικό Live Βίντεο & Ήχο!
    playBtn.addEventListener('click', () => {
      const currentTitle = document.getElementById('song-title').innerText;
      
      // 🔥 ΚΛΕΙΔΙ: Αν παίζει MP3 ή MP4, το πάτημα του Play σας επιστρέφει ΚΑΤΕΥΘΕΙΑΝ στο Live!
      if (currentTitle !== "📻 Panagiotis Live") {
        returnToLiveStream();
        return;
      }

      if (audio.paused) {
        const track = tracksData[currentTrackIndex];
        audio.src = track.audioSrc;
        audio.load();
        
        audio.play().catch(err => console.log("Χρειάζεται κλικ:", err));
        playIcon.className = 'fa-solid fa-pause';
        if (eqVisualizer) eqVisualizer.classList.add('playing');
      } else {
        audio.pause();
        audio.src = ""; 
        
        playIcon.className = 'fa-solid fa-play';
        if (eqVisualizer) eqVisualizer.classList.remove('playing');
      }
    });



    loadTrack(0);

       // 💬 Εναλλαγή Οθόνης Chat με έλεγχο Opacity για να μην πέφτει μαύρο στο Live Βίντεο!
    function toggleChatView() {
        const chatFrame = document.getElementById('embedded-chat');
        const playlistPanel = document.getElementById('embedded-playlist');

        if (!chatFrame) return;

        if (chatFrame.style.opacity === "0" || chatFrame.style.opacity === "") {
            chatFrame.style.opacity = "1";
            chatFrame.style.pointerEvents = "auto"; 
            if (playlistPanel) playlistPanel.style.display = 'none';
            document.getElementById('open-chat-btn').innerHTML = '<i class="fas fa-music"></i>';
        } else {
            chatFrame.style.opacity = "0";
            chatFrame.style.pointerEvents = "none"; 
            document.getElementById('open-chat-btn').innerHTML = '<i class="far fa-comment"></i>';
        }
    }

    const volumeBar = document.getElementById('volume-bar');

    if (audio) {
        audio.volume = 0.5;
    }

    if (volumeBar) {
        volumeBar.addEventListener('input', (e) => {
            if (audio) { audio.volume = e.target.value; }
        });
    }

    // 📺 Ο ΜΗΧΑΝΙΣΜΟΣ ΠΟΥ ΠΑΙΖΕΙ ΚΑΙ .M3U8 ΚΑΙ .MP4 ΒΙΝΤΕΟ!
    const videoElement = document.getElementById('bg-video');
    const videoSource = "https://eco.streams.ovh:8081/barazatv/index.m3u8"; 
    let hls = null;

    function initHLS() {
      if (videoElement) {
        if (videoSource.endsWith('.m3u8')) {
          if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, maxBufferSize: 30 * 1000 * 1000, enableWorker: true, lowLatencyMode: false });
            hls.loadSource(videoSource); hls.attachMedia(videoElement);
          } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = videoSource;
          }
        } else {
          videoElement.src = videoSource;
        }
      }
    }
    initHLS();

    function toggleVideoSound() {
        const vid = document.getElementById('bg-video');
        const muteIcon = document.getElementById('video-mute-icon');
        if (vid) {
            if (vid.muted) { vid.muted = false; muteIcon.className = "fas fa-volume-up"; } 
            else { vid.muted = true; muteIcon.className = "fas fa-volume-mute"; }
        }
    }

                   // 🎶 Ανοιγοκλείσιμο Λίστας Τραγουδιών: Το βίντεο παραμένει ανοιχτό και φαίνεται από πίσω!
    function togglePlaylistView() {
      const playlistPanel = document.getElementById('embedded-playlist');
      const chatFrame = document.getElementById('embedded-chat');
      if (!playlistPanel) return;

      if (playlistPanel.style.display === 'none' || playlistPanel.style.display === '') {
        playlistPanel.style.display = 'block';
        playlistPanel.style.pointerEvents = 'auto'; 
        
        // 🔥 ΚΛΕΙΔΙ: Αφαιρέσαμε την εντολή που έκρυβε το βίντεο! Τώρα το αφήνουμε ανοιχτό!
        
        if (chatFrame) {
            chatFrame.style.display = 'none';
            chatFrame.style.opacity = "0";
            chatFrame.style.pointerEvents = "none";
        }
      } else {
        playlistPanel.style.display = 'none';
        playlistPanel.style.pointerEvents = 'none';
        if (videoElement) videoElement.style.display = 'block';
        
        if (chatFrame) {
            chatFrame.style.display = 'block';
        }
      }
    }


       // ⚡ On-Demand Αναπαραγωγή (Διορθωμένη για MP3, MP4 και σταθερό Chat)
    function playOnDemand(index) {
        const track = onDemandTracks[index];
        if (!track) return;

        audio.pause(); audio.src = ""; isPlaying = false;
        playIcon.className = "fas fa-play";
        document.getElementById('song-title').innerText = track.title;
        document.getElementById('artist-name').innerText = track.artist;

        // 🔥 ΚΛΕΙΔΙ: Αποσυνδέουμε πλήρως το HLS για να μπορέσει να παίξει το MP4 βίντεο!
        if (hls) { hls.detachMedia(); }
        const coverBox = document.getElementById('mp3-cover-box');

        if (track.isTextOnly) {
          audio.src = track.fileUrl; audio.load(); audio.play().catch(e => console.log(e));
          if (videoElement) videoElement.style.display = 'block'; 
          if (coverBox && track.coverUrl) {
            coverBox.style.backgroundImage = `url('${track.coverUrl}')`;
            coverBox.style.display = 'block';
          }
          if (videoElement && videoSource.endsWith('.m3u8')) { initHLS(); }
        } else {
          if (coverBox) coverBox.style.display = 'none'; 
          if (videoElement) {
            videoElement.style.display = 'block';
            videoElement.src = track.fileUrl; 
            videoElement.load(); 
            videoElement.muted = false;
            videoElement.play().catch(e => console.log(e));
            document.getElementById('video-mute-icon').className = "fas fa-volume-up";
            videoElement.addEventListener('ended', returnToLiveStream, { once: true });
          }
        }
        
        const playlistPanel = document.getElementById('embedded-playlist');
        if (playlistPanel) playlistPanel.style.display = 'none';

        // 🔓 Εξασφάλιση ότι το Chat είναι μόνιμα έτοιμο να ανοίξει πάνω από το κομμάτι!
        const chatFrame = document.getElementById('embedded-chat');
        if (chatFrame) chatFrame.style.display = 'block';
    }


            function closePlaylistAndReturn() {
      const playlistPanel = document.getElementById('embedded-playlist');
      const chatFrame = document.getElementById('embedded-chat');
      
      if (playlistPanel) playlistPanel.style.display = 'none';
      if (videoElement) videoElement.style.display = 'block';
      
      // 🔥 ΚΛΕΙΔΙ: Επαναφέρουμε την υποδομή του Chat όταν πατάμε το "Χ"
      if (chatFrame) chatFrame.style.display = 'block';
    }



                // 🔄 Η συνάρτηση της Απόλυτης Επιστροφής στην Αρχική ΘΕΣΗ
    function returnToLiveStream() {
        document.getElementById('song-title').innerText = "📻 Panagiotis Live";
        document.getElementById('artist-name').innerText = "PM Panagiotis & PJ Lady Punk";

        const coverBox = document.getElementById('mp3-cover-box');
        if (coverBox) coverBox.style.display = 'none';

        if (videoElement) {
          videoElement.style.display = 'block'; // Εμφανίζουμε την οθόνη του βίντεο
          videoElement.muted = true; // Ξαναμπαίνει σε σίγαση το βίντεο
          document.getElementById('video-mute-icon').className = "fas fa-volume-mute";
          initHLS(); // 🔥 Ξαναφορτώνει τη ζωντανή ροή m3u8
          videoElement.play().catch(e => console.log(e));
        }

        // 🔓 ΔΙΟΡΘΩΣΗ: Σωστή ανάγνωση του πίνακα [0] για να ξεκινήσει ο live ήχος ακαριαία!
        audio.src = tracksData[0].audioSrc; 
        audio.load(); 
        audio.play().catch(e => console.log(e));
        playIcon.className = "fas fa-pause";
        isPlaying = true;
    }



    function copyRadioLink() {
      const currentLink = window.location.href;
      const btnText = document.getElementById('share-btn-text');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentLink).then(() => { showSuccessMessage(btnText); }).catch(() => { fallbackCopy(currentLink, btnText); });
      } else { fallbackCopy(currentLink, btnText); }
    }

    function fallbackCopy(text, element) {
      const textArea = document.createElement("textarea");
      textArea.value = text; textArea.style.position = "fixed"; document.body.appendChild(textArea);
      textArea.focus(); textArea.select();
      try { document.execCommand('copy'); showSuccessMessage(element); } catch (err) {}
      document.body.removeChild(textArea);
    }

    function showSuccessMessage(element) {
      if (element) { element.innerText = "Αντιγράφηκε! ✅"; setTimeout(() => { element.innerText = "Share"; }, 2000); }
    }              
       // 🎨 Απόλυτη Λειτουργία που αλλάζει live το Theme σε ΟΛΑ τα εσωτερικά κουτιά (Play/Volume/Chat/Controls)!
    function changePlayerTheme(bodyGradient, containerGradient) {
        // 1. Αλλάζουμε το gradient έξω από τον Player (body)
        document.body.style.setProperty('background', bodyGradient, 'important');
        
        // 2. Εντοπίζουμε το κεντρικό κουτί του Player
        const playerBox = document.querySelector('.container') || document.querySelector('.player-container') || document.body.querySelector('div');
        if (playerBox) {
            playerBox.style.setProperty('background', containerGradient, 'important');
        }

        // 3. 🔥 ΚΛΕΙΔΙ: Εντοπίζουμε live το εσωτερικό κουτί των controls (Play, Volume, Chat, Λίστα) και του αλλάζουμε το Theme!
        const controlsBox = document.querySelector('.controls') || document.querySelector('.buttons') || document.querySelector('.volume-container');
        if (controlsBox) {
            controlsBox.style.setProperty('background', containerGradient, 'important');
            controlsBox.style.setProperty('background-color', 'transparent', 'important'); // Το κάνουμε διάφανο για να πάρει το σωστό gradient!
        }
        
        // 4. Εξασφαλίζουμε ότι και τα υπόλοιπα γειτονικά εσωτερικά div (όπως η κοινωνική δικτύωση) θα εναρμονιστούν
        const socialBox = document.querySelector('.social-box');
        if (socialBox) {
            socialBox.style.setProperty('background', 'transparent', 'important');
        }
    }
</script>
